version: "3.9"

services:
  api:
    build: .
    container_name: senegal-connect-api
    ports:
      - "3001:3001"
      - "9001:9001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: senegal_connect
      DB_USER: postgres
      DB_PASS: change_this_password
      PORT: 3001
      PEERJS_PORT: 9001
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:14-alpine
    container_name: senegal-connect-db
    environment:
      POSTGRES_DB: senegal_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mhddiene
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d senegal_connect"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


volumes:
  pgdata: